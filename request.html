<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Request</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f8;
    margin:0;
}
.wrap{
    max-width:600px;
    margin:60px auto;
    background:white;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
}
input{
    width:100%;
    padding:15px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-top:20px;
}
button{
    margin-top:25px;
    background:#2d72ff;
    color:white;
    border:none;
    padding:15px 25px;
    font-size:18px;
    border-radius:6px;
    cursor:pointer;
}
button:hover{background:#1a5be0;}
</style>
</head>

<body>

<div class="wrap">
<h2>Enter your email to receive payment instructions</h2>

<form action="https://formsubmit.co/jelena.tihonova@proton.me" method="POST">
    <input type="hidden" name="product" id="productField">
    <input type="email" name="email" placeholder="Your email" required>
    <input type="hidden" name="_next" id="nextPage">

    <!-- защита от ботов -->
    <input type="text" name="_honey" style="display:none">

    <!-- без капчи -->
    <input type="hidden" name="_captcha" value="false">

    <!-- тема письма -->
    <input type="hidden" name="_subject" value="New order request">

    <button type="submit">Send request</button>
    
</form>
<script>
const params = new URLSearchParams(window.location.search);
const product = params.get('product');

let amount="";
if(product==="extended20") amount="45€";
if(product==="extended40") amount="75€";

document.getElementById("nextPage").value =
"/pay.html?product="+product+"&amount="+amount;
</script>

</div>
<script>
const params = new URLSearchParams(window.location.search);
const product = params.get('product');
if(product){
    document.getElementById('productField').value = product;
}
</script>

</body>
</html>
